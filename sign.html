<!DOCTYPE html>

<head>

  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <!--
    Redirect stub (2026-07-16). This page WAS the pre-signer.html per-signer
    signature page; the live signing surface is /signer.html. Ancient emailed
    links still point here carrying ?t=<signer token>, so this stub forwards
    the FULL query string and hash to /signer.html instead of serving stale
    signing code. JS location.replace does the real redirect (keeps ?t= and
    keeps this stub out of the back button); the meta refresh below is the
    no-JS fallback (it cannot carry the query, but signer.html shows its own
    missing-token message rather than stale code). Do not add signing logic
    back here.
  -->
  <meta http-equiv="refresh" content="1;url=/signer.html">
  <script>
  (function () {
    try {
      location.replace('/signer.html' + location.search + location.hash);
    } catch (e) {}
  })();
  </script>
</head>
